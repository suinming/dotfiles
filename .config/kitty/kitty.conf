# ==============================================================================
# FONTS & TEXT
# ==============================================================================
font_family         JetBrains Mono
font_size           26.0
adjust_line_height  10

# ==============================================================================
# CURSOR & BELL
# ==============================================================================
cursor_shape          block 
cursor_blink_interval 0
enable_audio_bell     no

# ==============================================================================
# SYSTEM & CONTROL
# ==============================================================================
shell_integration    enabled
allow_remote_control yes

# ==============================================================================
# WINDOW LAYOUTS
# ==============================================================================
# Enables the splits layout (splits is listed first to make it the default)
enabled_layouts splits, stack

# ==============================================================================
# KEYBINDINGS
# ==============================================================================

# --- Window Management ---
# Vertical and horizontal splitting
map kitty_mod+v launch --location=vsplit
map kitty_mod+s launch --location=hsplit  # Changed from kitty_mod+h to avoid conflict with Vim scrollback

# --- Vim Scrollback (Copy text from terminal) ---
map kitty_mod+h launch --stdin-source=@screen_scrollback --type=overlay /usr/bin/vim -R -M -c "set nospell syntax=" -c "vnoremap y :w !pbcopy<CR><CR>" -c "normal G" -c "nnoremap q :q!<CR>" -

# --- Session Management (zmx) ---
map kitty_mod+j send_text all zmx attach j\n
map kitty_mod+k send_text all zmx attach k\n
